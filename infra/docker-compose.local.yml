name: campusdigest
services:
  campus_db:
    image: postgres:13.2
    env_file: ../.env
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - campus_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  campus_api:
    profiles: [app]
    build: ..
    env_file: ../.env
    environment:
      DB_HOST: campus_db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 8006
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      campus_db:
        condition: service_healthy
    volumes:
      - bot_data:/app/app/bot/data
    command: ["sh", "-c", "alembic upgrade head && python run.py"]
volumes:
  campus_data:
  bot_data:
